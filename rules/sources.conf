# Catalogo de fuentes (desacoplado del motor, RNF-05).
# Formato: CLAVE=valor. Las listas se separan por espacios.

# Variables que el propio shell define: no se consideran entorno externo.
SPECIAL_VARS=BASH BASHOPTS BASHPID BASH_ALIASES BASH_ARGC BASH_ARGV BASH_CMDS BASH_COMMAND BASH_LINENO BASH_REMATCH BASH_SOURCE BASH_SUBSHELL BASH_VERSINFO BASH_VERSION COMP_WORDS EPOCHREALTIME EPOCHSECONDS EUID FUNCNAME GROUPS HISTCMD HOSTNAME HOSTTYPE IFS LINENO MACHTYPE MAPFILE OLDPWD OPTARG OPTIND OSTYPE PIPESTATUS PPID PWD RANDOM REPLY SECONDS SHELLOPTS SHLVL UID

# Descripcion de cada tipo de fuente (es|en).
TYPE_POSITIONAL=argumento posicional|positional argument
TYPE_ENV=variable de entorno|environment variable
TYPE_FILE=lectura de archivo|file read
TYPE_STDIN=entrada estandar|standard input
TYPE_COMMAND=salida de comando|command output

# Reglas de propagacion (es|en).
RULE_ASSIGN=asignacion directa|direct assignment
RULE_INTERP=interpolacion en cadena|string interpolation
RULE_CMDSUB=captura de comando|command capture
RULE_FOR=iteracion for|for iteration
RULE_ARGPARAM=argumento a funcion|argument to function
RULE_OVERWRITE=sobrescritura con valor limpio|overwrite with clean value

# Hallazgos (sinks): SINK_<clave>=severidad|CWE|descripcion es|descripcion en
# Severidades: CRITICAL > HIGH > MEDIUM > INFO. El modo conservative solo muestra CRITICAL y HIGH.
SINK_EVAL=CRITICAL|CWE-78|eval con dato externo|eval with external data
SINK_SUBSHELL=CRITICAL|CWE-78|subproceso con dato no validado|subprocess with unvalidated data
SINK_UNQUOTED=HIGH|CWE-88|variable contaminada sin entrecomillar|tainted variable without quotes
SINK_SANITIZED=MEDIUM|CWE-20|dato saneado o validado con lista blanca|sanitized or whitelist-validated data
SINK_LOWRISK=MEDIUM|CWE-20|dato contaminado sin comillas en comando de salida|tainted data unquoted in an output command
SINK_CONSTANT=INFO|---|variable sin comillas sin dato externo|unquoted variable without external data
SINK_EXECCMD=CRITICAL|CWE-78|comando elegido por el dato externo|command chosen by external data
SINK_SOURCEFILE=CRITICAL|CWE-94|carga de un script elegido por el dato externo|loading a script chosen by external data
SINK_SSHCMD=CRITICAL|CWE-78|comando remoto construido con el dato externo|remote command built with external data
